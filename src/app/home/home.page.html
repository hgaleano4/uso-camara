<ion-header>
  <ion-toolbar>
    <ion-title>
      Cámara del dispositivo
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>

    <ion-card-content>

      <div class="contenedor-imagen">
@if (imagen) {
        <ng-container>

          <ion-img [src]="imagen"></ion-img>

        </ng-container>
}

        <ng-template #sinImagen>

          <div class="sin-imagen">
            <ion-icon name="camera-outline"></ion-icon>

            <p>
              No hay fotografías disponibles
            </p>
          </div>

        </ng-template>

      </div>

      <ion-button
        expand="block"
        (click)="abrirCamara()">

        <ion-icon
          slot="start"
          name="camera-outline">
        </ion-icon>

        Tomar fotografía

      </ion-button>

    </ion-card-content>

  </ion-card>

</ion-content>
